apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metabob-activity-api.fullname" . }}
  labels:
    {{- include "metabob-activity-api.labels" . | nindent 4 }}
type: Opaque
data:
  surrealdb-username: {{ .Values.config.surrealdb.username | b64enc | quote }}
  surrealdb-password: {{ .Values.config.surrealdb.password | b64enc | quote }}
  # JWT signing secret — single source of truth (see values.yaml `secrets`
  # block). Read by both the main container (env JWT_SECRET) and the
  # init-database initContainer (substituted into migration 069's `KEY`).
  jwt-secret: {{ required "secrets.jwtSecret is required (set activityApi.jwtSecret in secrets/{env}.secrets.yaml; helmfile injects it as secrets.jwtSecret here)" .Values.secrets.jwtSecret | b64enc | quote }}
