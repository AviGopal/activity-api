# Default values for metabob-activity-api
replicaCount: 2

# Secrets injected by helmfile from secrets/{env}.secrets.yaml.
# `secrets.jwtSecret` is the source-of-truth value for the JWT signing key
# used by metabob-activity-api. Populates the k8s secret data key
# `jwt-secret`, which is read by BOTH the API container (env JWT_SECRET via
# config.ts → resolveJwtSecret) AND the init-database initContainer (which
# substitutes `__JWT_SECRET__` in .surql migration files via
# scripts/init-database.ts). Misalignment between the two breaks
# /v2/impulses/resolve with "The access method cannot be used in the
# requested operation". See helmfile.yaml.gotmpl for the injection wiring.
secrets:
  jwtSecret: ""

image:
  repository: metabobapp/metabob-activity-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: docker-hub-pull
nameOverride: ""
fullnameOverride: ""

# Database initialization
initDatabase:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Configuration
config:
  # Server
  port: 8080
  host: "0.0.0.0"
  
  # SurrealDB connection
  surrealdb:
    url: "http://surrealdb.activity-system.svc.cluster.local:8000"
    namespace: "activity-system"
    database: "learning_loop"
    username: "root"
    password: "changeme"  # Override in production
  
  # Redis connection
  redis:
    url: "redis://valkey.activity-system.svc.cluster.local:6379"
    sessionTtl: 86400     # 24 hours
    templateTtl: 3600     # 1 hour
    metricsTtl: 300       # 5 minutes
  
  # Security
  auth:
    requireAuth: false    # Set to true in production
  
  # Logging
  logLevel: "info"        # debug, info, warn, error
  logFormat: "json"       # json or text
  
  # CORS
  corsOrigins: "*"        # Comma-separated list

# Resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod configuration
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: activity-api.metabob.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Development configuration
dev:
  enabled: false
  hotReload: false
  volumeMounts: []
