# Lefthook pre-commit hooks configuration
# Install: curl -1sLf 'https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.deb.sh' | sudo -E bash && sudo apt install lefthook
# Or: brew install lefthook
# Then: lefthook install

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck

    lint:
      glob: "*.{ts,tsx}"
      run: bun run lint {staged_files}

    format-check:
      glob: "*.{ts,tsx,json,md}"
      run: bunx prettier --check {staged_files}

    secrets:
      run: |
        if command -v gitleaks &> /dev/null; then
          gitleaks protect --staged --config .gitleaks.toml --verbose
        else
          echo "⚠️  gitleaks not installed, skipping secret scan"
          echo "   Install: brew install gitleaks (macOS) or apt install gitleaks (Linux)"
        fi

    no-debug:
      glob: "*.{ts,tsx}"
      run: |
        if grep -l "console\.log\|debugger" {staged_files} 2>/dev/null; then
          echo "⚠️  Found console.log or debugger statements in staged files"
          exit 1
        fi

pre-push:
  commands:
    test:
      run: bun test

    version-sync:
      run: |
        # Check if we're pushing a tag
        if git describe --exact-match --tags HEAD 2>/dev/null; then
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG_VERSION=$(git describe --exact-match --tags HEAD | sed 's/^v//')
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: package.json=$PKG_VERSION, tag=v$TAG_VERSION"
            exit 1
          fi
        fi
