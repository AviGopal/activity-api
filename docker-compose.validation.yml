version: '3.8'

services:
  # SurrealDB for test data
  surrealdb:
    image: surrealdb/surrealdb:v2.0.4
    ports:
      - "8001:8000"
    command:
      - start
      - --log=info
      - --user=root
      - --pass=root
      - memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Activity API
  activity-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SURREALDB_URL=http://surrealdb:8000
      - SURREALDB_NAMESPACE=validation
      - SURREALDB_DATABASE=test_learning
      - SURREALDB_USERNAME=root
      - SURREALDB_PASSWORD=root
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
      - DISCOVERY_ENABLED=false
    depends_on:
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Validation test runner
  validation-tests:
    build:
      context: .
      dockerfile: Dockerfile
    command: bun run validate-thompson-learning.ts
    environment:
      - SURREALDB_URL=http://surrealdb:8000
      - SURREALDB_NAMESPACE=validation
      - SURREALDB_DATABASE=test_learning
      - SURREALDB_USERNAME=root
      - SURREALDB_PASSWORD=root
    depends_on:
      activity-api:
        condition: service_healthy
    profiles:
      - test
